[project]
name = "relay-desk"
version = "0.1.0"
description = "Three-agent research desk: gather, draft, roast."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yuvraj" }]

[project.scripts]
relay-desk = "relay_desk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relay_desk*"]
